[package]
name = "fromsoftware-shared"
version = "0.14.0"
edition = "2024"
repository = "https://github.com/vswarte/eldenring-rs"
license = "MIT OR Apache-2.0"
readme = false
description = "Helpers for dealing with pointers and other common stuff across games"

[dependencies]
windows = { version = "0.61", features = ["Win32_Foundation","Win32_System_Kernel","Win32_System_Threading","Win32_UI_Input_KeyboardAndMouse","Win32_System_Diagnostics_Debug","Win32_System_LibraryLoader","Win32_System_Memory","Win32_Security"] }
glam = ">= 0.30"
pelite = "0.10"
fromsoftware-shared-macros = { path = "macros", version = "0.14.0" }
thiserror = "1"
vtable-rs = "0.1.5"
bitflags = "2.13.1"
undname = "2"
from-singleton = "3"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
